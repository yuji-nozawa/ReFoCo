dino:
  loss_weight: 0.9
train:
  dataset_path: ImageNet:split=TRAIN
  batch_size_per_gpu: 128
student:
  block_chunks: 4
  num_selections: 5
  num_register_tokens: 4
  phsblock_idx_from_end: 0
optim:
  epochs: 400
  base_lr: 0.004  # learning rate for a batch size of 1024
phs:
  loss_weight_inside: 0.05
  loss_weight_outside: 0.05